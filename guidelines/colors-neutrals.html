<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.sw i{display:block;height:64px}.sw b{display:block;font:500 12px/1.3 var(--font-body);margin-top:6px;color:var(--text-body)}.sw span{display:block;font:400 11px/1.3 var(--font-body);color:var(--text-muted);letter-spacing:.04em}</style></head><body><div class="row"><div class="sw"><i style="background:var(--bt-black)"></i><b>Black</b><span>#000000</span></div><div class="sw"><i style="background:var(--bt-ink)"></i><b>Ink</b><span>#201E1D</span></div><div class="sw"><i style="background:var(--bt-ink-2)"></i><b>Ink 2</b><span>#605D5D</span></div><div class="sw"><i style="background:var(--bt-ink-3)"></i><b>Ink 3</b><span>#7B7B7B</span></div><div class="sw"><i style="background:var(--bt-stone)"></i><b>Stone</b><span>#CFC8BB</span></div><div class="sw"><i style="background:var(--bt-paper-2)"></i><b>Paper 2</b><span>#F5F5F5</span></div></div></body></html>
