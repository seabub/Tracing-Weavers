<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.sw i{display:block;height:64px}.sw b{display:block;font:500 12px/1.3 var(--font-body);margin-top:6px;color:var(--text-body)}.sw span{display:block;font:400 11px/1.3 var(--font-body);color:var(--text-muted);letter-spacing:.04em}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px"><div style="background:var(--surface-card);border:1px solid var(--border-subtle);height:80px;padding:12px;font:400 12px/1.3 var(--font-body);color:var(--text-muted)">Card<br>1px --border-subtle · radius 0</div><div style="background:var(--surface-card);border-top:2px solid var(--accent);height:80px;padding:12px;font:400 12px/1.3 var(--font-body);color:var(--text-muted)">Step card<br>2px red top rule</div><div style="background:var(--surface-card);box-shadow:var(--shadow-float);height:80px;padding:12px;border-radius:var(--radius-md);font:400 12px/1.3 var(--font-body);color:var(--text-muted)">Dialog<br>--shadow-float · radius 4</div></div></body></html>
