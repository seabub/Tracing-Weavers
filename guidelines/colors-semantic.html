<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page)}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.sw i{display:block;height:64px}.sw b{display:block;font:500 12px/1.3 var(--font-body);margin-top:6px;color:var(--text-body)}.sw span{display:block;font:400 11px/1.3 var(--font-body);color:var(--text-muted);letter-spacing:.04em}</style></head><body><div class="row"><div class="sw"><i style="background:var(--surface-page)"></i><b>--surface-page</b><span>paper</span></div><div class="sw"><i style="background:var(--surface-card)"></i><b>--surface-card</b><span>white</span></div><div class="sw"><i style="background:var(--surface-tint)"></i><b>--surface-tint</b><span>blush</span></div><div class="sw"><i style="background:var(--surface-inverse)"></i><b>--surface-inverse</b><span>ink</span></div><div class="sw"><i style="background:var(--accent)"></i><b>--accent</b><span>red</span></div><div class="sw"><i style="background:var(--border-subtle)"></i><b>--border-subtle</b><span>stone</span></div></div></body></html>
