<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script><style>html,body{margin:0;min-height:100%;background:var(--bt-paper-2)}#root{display:grid;place-items:center;min-height:100vh}</style></head><body><div id="root"></div>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
function App(){const [i,setI]=React.useState(()=>+(sessionStorage.getItem("bt-tw")||0));React.useEffect(()=>sessionStorage.setItem("bt-tw",i),[i]);
  const go=()=>setI(v=>v+1),back=()=>setI(v=>Math.max(0,v-1));
  return [<ScanScreen key={0} go={go}/>,<WeaverScreen key={1} go={go} back={back}/>,<ClothScreen key={2} go={go} back={back}/>,<JourneyScreen key={3} go={go} back={back}/>,<ImpactScreen key={4} back={back} restart={()=>setI(0)}/>][i];}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
