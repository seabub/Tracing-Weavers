<!-- @dsCard group="Lead Capture" viewport="1100x760" name="Lead capture / QR landing" subtitle="Interest picks, contact fields, thank-you dialog" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><style>html,body{margin:0;background:var(--bt-paper)}.wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}.photo{background:url(../../assets/imagery/loom-interior.jpg) center/cover;position:relative;filter:var(--photo-filter)}.photo .s{position:absolute;inset:0;background:var(--scrim-bottom)}.photo .t{position:absolute;left:40px;right:40px;bottom:40px;color:#fff}.form{padding:64px 72px;display:grid;gap:22px;align-content:start;max-width:560px}.chips{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:860px){.wrap{grid-template-columns:1fr}.photo{min-height:260px}.form{padding:40px 24px}}</style></head><body><div id="root"></div>
<script type="text/babel">
const {Eyebrow,Button,Input,Select,Checkbox,Tag,Dialog}=window.BeyondTenunDesignSystem_9d918e;
const INTERESTS=["Impact Partnership","Foundation / Grant","Philanthropic Capital","Corporate Partnership","Technology Partnership","Education Partnership","Knowledge / Research","Community Visit","Request a Meeting"];
function App(){const [picked,setPicked]=React.useState(["Impact Partnership"]);const [done,setDone]=React.useState(false);const [err,setErr]=React.useState({});const [v,setV]=React.useState({});
  const set=k=>x=>setV(s=>({...s,[k]:x}));
  const submit=e=>{e.preventDefault();const er={};if(!v.name)er.name="Required";if(!v.org)er.org="Required";if(!v.contact)er.contact="Email or WhatsApp is required";setErr(er);if(!Object.keys(er).length)setDone(true)};
  return <div className="wrap">
    <div className="photo"><div className="s"/><div className="t"><Eyebrow inverse>Beyond Tenun · Seed to Loom</Eyebrow><h1 style={{font:"900 44px/1.02 var(--font-display)",letterSpacing:"-.02em",marginTop:16,maxWidth:"14ch"}}>Join the three-year journey.</h1><p style={{font:"400 17px/1.4 var(--font-body)",color:"rgba(255,255,255,.75)",marginTop:14,maxWidth:"40ch"}}>Tell us how you'd like to be involved and we'll send the executive brief within 72 hours.</p></div></div>
    <form className="form" onSubmit={submit}>
      <div><Eyebrow>Your interest</Eyebrow><div className="chips" style={{marginTop:14}}>{INTERESTS.map(i=><button key={i} type="button" onClick={()=>setPicked(p=>p.includes(i)?p.filter(x=>x!==i):[...p,i])} style={{all:"unset",cursor:"pointer",display:"inline-flex"}}><Tag tone={picked.includes(i)?"accent":"neutral"}>{i}</Tag></button>)}</div></div>
      <Input label="Name" placeholder="Full name" value={v.name||""} onChange={set("name")} error={err.name}/>
      <Input label="Organization" placeholder="Foundation, fund or company" value={v.org||""} onChange={set("org")} error={err.org}/>
      <Input label="Role" placeholder="Your role" value={v.role||""} onChange={set("role")}/>
      <Input label="Email or WhatsApp" placeholder="name@org.com or +62…" value={v.contact||""} onChange={set("contact")} error={err.contact}/>
      <Select label="How did you find us" options={["TBN Conference booth","Leaders Roundtable","Investor meeting","Printed one-pager"]} onChange={set("src")}/>
      <Checkbox label="Send me the executive brief and short deck" defaultChecked/>
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}><Button type="submit">Continue the conversation</Button><span style={{font:"400 13px/1.3 var(--font-body)",color:"var(--text-faint)"}}>No newsletters. One follow-up, then a meeting if you want one.</span></div>
    </form>
    <Dialog open={done} onClose={()=>setDone(false)} eyebrow="Thank you" title="We'll be in touch within 72 hours." actions={<Button onClick={()=>setDone(false)}>Done</Button>}>The executive brief is on its way{picked.length?" — marked for "+picked.join(", ")+".":"."}</Dialog>
  </div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
