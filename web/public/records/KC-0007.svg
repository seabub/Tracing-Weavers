  <text x="96" y="1018" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#FFFFFF" fill-opacity=".75">One season of a community cotton plot: seed, planting, harvest</text><text x="96" y="1062" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#FFFFFF" fill-opacity=".75">weight and the households the cotton went to. A shared record</text><text x="96" y="1106" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#FFFFFF" fill-opacity=".75">— up to forty people who worked the plot can hold the same …</text>

  

  <line x1="96" y1="1158" x2="984" y2="1158" stroke="#FFFFFF" stroke-opacity=".18"/>
  <text x="96" y="1258" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="24" letter-spacing="3" fill="#FFFFFF" fill-opacity=".62">The record travels with the product. Value returns to the household that made it.</text>
