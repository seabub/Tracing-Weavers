  <text x="96" y="218" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="24" letter-spacing="7" fill="#FFFFFF" fill-opacity=".62">THE RECORD</text>

  <text x="96" y="470" font-family="Hanken Grotesk, Telegraf, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="104" letter-spacing="-2" fill="#FFFFFF">Mama Ina Dida</text>
  <line x1="96" y1="618" x2="510" y2="618" stroke="#FFFFFF" stroke-opacity=".18"/><text x="96" y="654" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#FFFFFF" fill-opacity=".62">MAKER</text><text x="510" y="654" text-anchor="end" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="25" fill="#FFFFFF">Mama Ina Dida</text><line x1="96" y1="676" x2="510" y2="676" stroke="#FFFFFF" stroke-opacity=".18"/><text x="96" y="712" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#FFFFFF" fill-opacity=".62">ORIGIN</text><text x="510" y="712" text-anchor="end" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="25" fill="#FFFFFF">Adonara</text><line x1="96" y1="734" x2="510" y2="734" stroke="#FFFFFF" stroke-opacity=".18"/><text x="96" y="770" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#FFFFFF" fill-opacity=".62">MATERIAL</text><text x="510" y="770" text-anchor="end" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="25" fill="#FFFFFF">Hand-spun local cotton</text><line x1="96" y1="792" x2="510" y2="792" stroke="#FFFFFF" stroke-opacity=".18"/><text x="96" y="828" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#FFFFFF" fill-opacity=".62">TECHNIQUE</text><text x="510" y="828" text-anchor="end" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="25" fill="#FFFFFF">Back-strap ikat</text><line x1="570" y1="618" x2="984" y2="618" stroke="#FFFFFF" stroke-opacity=".18"/><text x="570" y="654" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#FFFFFF" fill-opacity=".62">DYE</text><text x="984" y="654" text-anchor="end" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="25" fill="#FFFFFF">Indigo leaf, morinda root</text><line x1="570" y1="676" x2="984" y2="676" stroke="#FFFFFF" stroke-opacity=".18"/><text x="570" y="712" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#FFFFFF" fill-opacity=".62">WEEKS ON THE LOOM</text><text x="984" y="712" text-anchor="end" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="25" fill="#FFFFFF">11</text><line x1="570" y1="734" x2="984" y2="734" stroke="#FFFFFF" stroke-opacity=".18"/><text x="570" y="770" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#FFFFFF" fill-opacity=".62">DYE BATHS</text><text x="984" y="770" text-anchor="end" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="25" fill="#FFFFFF">3</text><line x1="570" y1="792" x2="984" y2="792" stroke="#FFFFFF" stroke-opacity=".18"/><text x="570" y="828" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#FFFFFF" fill-opacity=".62">JOURNEY STEP</text><text x="984" y="828" text-anchor="end" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="25" fill="#FFFFFF">Trace</text>
  <text x="96" y="902" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#FFFFFF" fill-opacity=".75">Hand-spun local cotton, dyed with indigo leaf and morinda root on a</text><text x="96" y="946" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#FFFFFF" fill-opacity=".75">back-strap loom in Adonara. Eleven weeks on the loom, three dye baths. The</text><text x="96" y="990" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#FFFFFF" fill-opacity=".75">motif is shown with the weaver's permission; some of what it means stays</text><text x="96" y="1034" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#FFFFFF" fill-opacity=".75">with the community.</text>

  

  <line x1="96" y1="1158" x2="984" y2="1158" stroke="#FFFFFF" stroke-opacity=".18"/>
  <text x="96" y="1258" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="24" letter-spacing="3" fill="#FFFFFF" fill-opacity=".62">The record travels with the product. Value returns to the household that made it.</text>
  <text x="96" y="1298" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="24" letter-spacing="3" fill="#FF9783">http://localhost:3000/record/BT-0042</text>
